<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏆 Khela Hobe | Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <style>
        /* ===== REGISTER PAGE — CENTERED FORM ===== */
        .register-page {
            min-height: 100vh;
            width: 100vw;
            background-image: url('bg-sports.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .register-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.30);
            z-index: 0;
        }

        .register-page > * {
            position: relative;
            z-index: 1;
        }

        .register-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        /* ===== TWO-COLUMN LAYOUT: FORM + IMAGE ===== */
        .register-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 60px;
            max-width: 1100px;
            width: 100%;
        }

        /* LEFT: FORM */
        .register-form-box {
            max-width: 520px;
            width: 100%;
            background: rgba(11, 11, 11, 0.82);
            padding: 40px 35px;
            border-radius: 16px;
            border: 1px solid rgba(124, 203, 150, 0.12);
            backdrop-filter: blur(3px);
        }

        .register-form-box h2 {
            color: #7CCB96;
            font-size: 32px;
            margin-bottom: 4px;
        }

        .register-form-box p {
            color: #bdbdbd;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .register-form-box .form-group {
            margin-bottom: 15px;
        }

        .register-form-box .form-group input {
            height: 48px;
            width: 100%;
            padding: 12px 16px;
            border: none;
            outline: none;
            border-radius: 8px;
            background: rgba(32, 32, 32, 0.9);
            color: white;
            font-size: 14px;
        }

        .register-form-box .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .register-form-box .form-group input:focus {
            border: 2px solid #7CCB96;
        }

        .register-form-box .submit-btn {
            height: 48px;
            width: 100%;
            border: none;
            background: #7CCB96;
            color: #000000;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .register-form-box .submit-btn:hover {
            transform: translateY(-2px);
            background: #5E17EB;
            color: white;
        }

        .register-form-box .login-link {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .register-form-box .login-link a {
            color: #7CCB96;
            font-weight: 500;
        }

        .register-form-box .login-link a:hover {
            text-decoration: underline;
        }

        .register-form-box .double {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* RIGHT: PLAYER IMAGE */
        .register-image {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-image img {
            width: 85%;
            max-width: 480px;
            border-radius: 16px;
            filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.5));
        }

        /* Role Selector */
        .role-selector {
            display: flex;
            gap: 12px;
            margin: 10px 0 18px 0;
            flex-wrap: wrap;
        }

        .role-option {
            flex: 1;
            min-width: 100px;
            padding: 12px 15px;
            background: rgba(26, 26, 26, 0.9);
            border: 2px solid #2a2a2a;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            color: #888;
            font-size: 14px;
            font-weight: 500;
        }

        .role-option:hover {
            border-color: #7CCB96;
            background: #1a2a1a;
        }

        .role-option.selected {
            border-color: #7CCB96;
            background: #1a3a2a;
            color: #7CCB96;
        }

        .role-option input[type="radio"] {
            display: none;
        }

        .role-option i {
            display: block;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .role-option .role-label {
            font-size: 13px;
            font-weight: 600;
        }

        .role-option .role-desc {
            font-size: 10px;
            color: #666;
            display: block;
            margin-top: 3px;
        }

        .role-option.selected .role-desc {
            color: #7CCB96;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .register-wrapper {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .register-image {
                order: -1;
            }

            .register-image img {
                width: 60%;
            }
        }

        @media (max-width: 480px) {
            .register-form-box {
                padding: 25px 20px;
            }

            .register-form-box h2 {
                font-size: 24px;
            }

            .register-form-box .double {
                grid-template-columns: 1fr;
            }

            .role-selector {
                flex-direction: column;
            }

            .register-image img {
                width: 80%;
            }
        }
    </style>
</head>
<body>

<div class="register-page">

    <!-- ===== NAVBAR (EXACTLY MATCHES HOMEPAGE) ===== -->
    <header>
        <div class="container navbar">
            <div class="logo">
                <h2>
                    <span class="logo-khela">Khela</span>
                    <span class="logo-hobe">Hobe</span>
                    <span class="logo-trophy">🏆</span>
                </h2>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="search.php">Turfs & Fields</a></li>
                    <li><a href="privacy.html">Privacy Policy</a></li>
                    <li><a href="terms.html">Terms & Conditions</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="register.html" class="active">Register</a></li>
                </ul>
            </nav>
            <div class="nav-btn">
                <a href="login.html" class="login-btn">Login</a>
                <a href="register.html" class="register-btn">Register</a>
            </div>
        </div>
    </header>

    <!-- ===== REGISTER FORM + PLAYER IMAGE ===== -->
    <section class="register-section">
        <div class="register-wrapper">

            <!-- LEFT: FORM -->
            <div class="register-form-box">
                <h2>Create Your Account</h2>
                <p>Register to book your favourite sports field.</p>

                <form action="register.php" method="POST">
                    <!-- Role Selector -->
                    <div class="form-group">
                        <label style="color:#ccc; font-weight:bold; display:block; margin-bottom:8px; font-size:14px;">
                            <i class="fas fa-user-tag"></i> I want to register as:
                        </label>
                        <div class="role-selector">
                            <label class="role-option" id="role-player" onclick="selectRole('player')">
                                <input type="radio" name="role" value="player" checked>
                                <i class="fas fa-user"></i>
                                <span class="role-label">Player</span>
                                <span class="role-desc">Book & Play</span>
                            </label>
                            <label class="role-option" id="role-owner" onclick="selectRole('owner')">
                                <input type="radio" name="role" value="owner">
                                <i class="fas fa-store"></i>
                                <span class="role-label">Ground Owner</span>
                                <span class="role-desc">Manage Turfs</span>
                            </label>
                            <label class="role-option" id="role-admin" onclick="selectRole('admin')">
                                <input type="radio" name="role" value="admin">
                                <i class="fas fa-user-shield"></i>
                                <span class="role-label">Admin</span>
                                <span class="role-desc">Manage System</span>
                            </label>
                        </div>
                    </div>

                    <div class="double">
                        <div class="form-group">
                            <input type="text" name="firstname" placeholder="First Name" required>
                        </div>
                        <div class="form-group">
                            <input type="text" name="lastname" placeholder="Last Name" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <input type="email" name="email" placeholder="Email Address" required>
                    </div>

                    <div class="form-group">
                        <input type="text" name="phone" placeholder="Phone Number" required>
                    </div>

                    <div class="form-group">
                        <input type="password" name="password" placeholder="Password" required>
                    </div>

                    <div class="form-group">
                        <input type="password" name="confirm_password" placeholder="Confirm Password" required>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fas fa-user-plus"></i> Sign Up
                    </button>
                </form>

                <div class="login-link">
                    Already have an account? <a href="login.html">Login</a>
                </div>
            </div>

            <!-- RIGHT: PLAYER IMAGE -->
            <div class="register-image">
                <img src="players.png" alt="Player" />
            </div>

        </div>
    </section>

</div>

<script>
    function selectRole(role) {
        document.querySelectorAll('.role-option').forEach(el => {
            el.classList.remove('selected');
        });
        document.getElementById('role-' + role).classList.add('selected');
        document.querySelector('input[name="role"][value="' + role + '"]').checked = true;
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('role-player').classList.add('selected');
    });
</script>

</body>
</html>
